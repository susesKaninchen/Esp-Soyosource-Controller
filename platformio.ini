; PlatformIO Project Configuration File for Esp-Soyosource-Controller
; Open Source C++ Firmware for Soyosource GTN Inverters (Re-engineered & Enhanced)

[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.4
    knolleary/PubSubClient @ ^2.8
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
    -D ARDUINOJSON_USE_LONG_LONG=1

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.4
    knolleary/PubSubClient @ ^2.8
